<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 12 - ByteKart Store E-Commerce</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">ByteKart Store</div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="store">Storefront</button>
      <button class="tab-btn" data-tab="cart">Cart (<span id="cartCount">0</span>)</button>
      <button class="tab-btn" data-tab="orders">Successful Orders</button>
      <button class="tab-btn" data-tab="seller">Seller Master Panel</button>
    </nav>
  </header>

  <main class="container">
    <!-- STOREFRONT -->
    <section id="tab-store" class="tab-panel active">
      <h1>All Products</h1>
      <div id="productsGrid" class="grid"></div>
    </section>

    <!-- CART & PAYMENT -->
    <section id="tab-cart" class="tab-panel">
      <h1>Your Cart & Payment</h1>
      <div class="split">
        <div id="cartList" class="card-box"></div>
        <form id="checkoutForm" class="card-box stack">
          <h2>Payment Details</h2>
          <p class="total-line">Total Payable: <strong id="cartTotal">₹0</strong></p>
          <input type="text" id="customerName" placeholder="Full Name" required />
          <select id="paymentMethod" required>
            <option value="UPI">UPI (GPay / PhonePe / Paytm)</option>
            <option value="Card">Credit / Debit Card</option>
            <option value="NetBanking">Net Banking</option>
          </select>
          <input type="text" id="paymentDetail" placeholder="UPI ID or Last 4 Card Digits" required />
          <button type="submit" class="btn-primary">Pay & Place Order</button>
          <div id="paymentMsg"></div>
        </form>
      </div>
    </section>

    <!-- SUCCESSFUL ORDERS -->
    <section id="tab-orders" class="tab-panel">
      <h1>Successful Orders</h1>
      <div id="ordersList" class="stack"></div>
    </section>

    <!-- SELLER MASTER PANEL -->
    <section id="tab-seller" class="tab-panel">
      <h1>Seller Master Panel</h1>
      <div class="split">
        <form id="sellerForm" class="card-box stack">
          <h2 id="sellerFormTitle">Add New Product</h2>
          <input type="hidden" id="editProductId" />
          <input type="text" id="pName" placeholder="Product Name" required />
          <input type="text" id="pCategory" placeholder="Category" required />
          <input type="number" id="pPrice" placeholder="Price (₹)" step="0.01" required />
          <input type="number" id="pStock" placeholder="Stock Quantity" required />
          <textarea id="pDesc" rows="3" placeholder="Description" required></textarea>
          <div class="row">
            <button type="submit" class="btn-primary" id="sellerSubmitBtn">Add Product</button>
            <button type="button" class="btn-sec" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
          </div>
        </form>
        <div class="card-box">
          <h2>Manage Existing Products</h2>
          <div id="sellerProductList" class="stack"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
